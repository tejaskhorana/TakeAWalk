# Generates TakeAWalk.xcodeproj. Install with: brew install xcodegen
# then run: xcodegen generate
name: TakeAWalk
options:
  bundleIdPrefix: com.tejaskhorana
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
targets:
  TakeAWalk:
    type: application
    platform: iOS
    sources: [TakeAWalk, Shared]
    entitlements:
      path: TakeAWalk/TakeAWalk.entitlements
    dependencies:
      - target: TakeAWalkWidget
        embed: true
    info:
      path: TakeAWalk/Info.plist
      properties:
        CFBundleDisplayName: TakeAWalk
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: TakeAWalk uses your location to check the weather where you are.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.tejaskhorana.TakeAWalk.refresh]
  TakeAWalkWidget:
    type: app-extension
    platform: iOS
    sources: [TakeAWalkWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejaskhorana.TakeAWalk.Widget
    entitlements:
      path: TakeAWalkWidget/TakeAWalkWidget.entitlements
    info:
      path: TakeAWalkWidget/Info.plist
      properties:
        CFBundleDisplayName: TakeAWalk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
